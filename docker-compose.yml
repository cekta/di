name: cekta-di
services:
  app:
    build:
      context: ./
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
    user: ${UID:-1000}
    tty: ${TTY:-true}
    volumes:
      - ./:/app
    environment:
      - XDEBUG_MODE=debug
      - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003 start_with_request=yes
    extra_hosts:
      - "host.docker.internal:host-gateway" 

  pages:
    image: peaceiris/mdbook:latest
    user: ${UID:-1000}
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    working_dir: /app
    command:
      - serve
      - -n
      - 0.0.0.0
